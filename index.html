<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <title>Feliz Cumpleaños</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background-color: #111;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        /* Fuerza a que el escalado interno no tenga antialiasing/blur */
        image-rendering: pixelated;
        touch-action: none;
        outline: none;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #111;
        color: #f0ebd7;
        font-family: sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
      }
      #rotate-hint .icon { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
      #rotate-hint p { margin: 0; font-size: 18px; line-height: 1.4; }
      @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint"><div class="icon">📱</div><p>Gira tu celular en horizontal<br>para jugar</p></div>
    <!-- Punto de entrada principal para Vite -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
